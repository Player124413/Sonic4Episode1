[group.console-stages-pc]
source = "pc"
# fallback chain is .pc -> .console -> base: base is mobile assets on mobile-era levels, console is
# xbla-grade assets still on mobile-era levels, pc is xbla-grade assets on PC-era levels. A stage
# takes every archive from one tier, never mixed.
name = "pc"
# ZONE2_M/_T/_ATTR are shared by all four zone 2 acts, so the whole zone moves to this tier or none
# of it does.
archives = [
  "G_ZONE2/MAP/ZONE21_MAP.AMB",
  "G_ZONE2/MAP/ZONE22_MAP.AMB",
  "G_ZONE2/MAP/ZONE23_MAP.AMB",
  "G_ZONE2/MAP/ZONE2BOSS_MAP.AMB",
