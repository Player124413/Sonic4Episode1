# own group rather than a line in console-stages purely because of `flip`: effects are drawn
# through the GL layer, which samples console DDS the other way up from what its UVs expect, where
# the stdshader models in console-stages must not be flipped.
[group.console-effects]
source = "xbla"
name = "console"
flip = true
# EFF_CMN is mixed: its sprite textures flip with the rest of the group, but these four hold
# textures its NN model nodes use, which draw through stdshader and must not be flipped. The only
# effect archive with model nodes, so the only one that needs this.
no_flip = [
  "EFF_CMN_TEX_MD_BA.AMB",
  "EFF_CMN_TEX_MD_HA.AMB",
  "EFF_CMN_TEX_MD_RD.AMB",
