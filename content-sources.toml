  "G_ZONE2/MAP/ZONE2_ATTR.AMB",
  "G_ZONE2/MAPFAR/ZONE2_MAPFAR.AMB",

  # map node and material motion, PC-only: mobile compiled these out (GMD_GAMEDAT_NO_CREATE_MAP_MOTION)
  "G_ZONE2/MAP/ZONE2_M_M.AMB",
  "G_ZONE2/MAP/ZONE2_M_V.AMB",

  # deco ids 184-199 index this archive's MDL, 11 members on PC against mobile's 2, so it moves
  # with the tier rather than being left behind
