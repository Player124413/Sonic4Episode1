name: Build Android APK

on:
  push:
    branches:
      - master
      - arena/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: io.github.player124413.sonic4ep1
  ANDROID_IMAGE: system-images;android-34;google_apis;x86_64

jobs:
  android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The game content (Assets/Content, several hundred MB, not redistributable) is optional for
      # the build itself - without it the APK starts and tells the player that content is missing.
      # If you keep your own copy somewhere that the runner can reach (a private release asset, a
      # secret with a download url, ...) download/unpack it here into
      # Sonic4Episode1.Android/Assets/Content before publishing.

      - name: Restore
        run: |
          set -o pipefail
          dotnet restore Sonic4Episode1.Android/Sonic4Episode1.Android.csproj 2>&1 | tee -a build.log

      - name: Publish
        run: |
          set -o pipefail
          dotnet publish Sonic4Episode1.Android/Sonic4Episode1.Android.csproj \
            -c Release -f net10.0-android -p:AndroidPackageFormat=apk 2>&1 | tee -a build.log

      # The raw job log lives in storage that is not reachable from every environment, so the
      # interesting bits are emitted as annotations (readable through the REST API) as well.
      - name: Report build problems
        if: failure()
        run: |
          if [ -f build.log ]; then
            tail -c 2500 build.log | tr -d '\r' | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g' > annotation.txt
            echo "::error title=Android build failed::$(cat annotation.txt)"
          fi

      - name: Collect build diagnostics
        if: success()
        run: |
          set +e
          {
            echo "=== effective build properties ==="
            dotnet msbuild Sonic4Episode1.Android/Sonic4Episode1.Android.csproj -nologo \
              -getProperty:TargetFramework -getProperty:TargetSdkVersion -getProperty:SupportedOSPlatformVersion \
              -getProperty:AndroidPackageFormat -getProperty:PublishTrimmed -getProperty:AndroidLinkMode \
              -getProperty:RunAOTCompilation -getProperty:AndroidEnableProfiledAot \
              -getProperty:AndroidEnableMarshalMethods -getProperty:AndroidSupportedAbis \
              -getProperty:RuntimeIdentifiers -getProperty:ApplicationId 2>&1 | tail -40
            echo
            echo "=== merged AndroidManifest.xml ==="
            MANIFEST=$(find obj -name 'AndroidManifest.xml' -path '*net10.0-android*' | head -1)
            echo "($MANIFEST)"
            grep -vE '^\s*$' "$MANIFEST" | head -60
            echo
            echo "=== APK contents ==="
            for apk in Sonic4Episode1.Android/bin/Release/net10.0-android/publish/*.apk; do
              echo "--- $apk ($(stat -c%s "$apk") bytes)"
              unzip -l "$apk" | head -25
              echo "lib entries: $(unzip -l "$apk" | grep -c 'lib/')"
              echo "--- native libraries (must be stored, not deflated)"
              unzip -v "$apk" | grep -E 'lib/.*\.so' | head -20
            done
          } > diagnostics.txt 2>&1
          cat diagnostics.txt
          awk 'length($0) > 0 { printf "::notice title=diag::%s\n", $0 }' < <(sed -e 's/%/%25/g' -e 's/\r//g' diagnostics.txt | head -30)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonic4-android-apk
          path: Sonic4Episode1.Android/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            diagnostics.txt
            build.log
          if-no-files-found: ignore

  # Boots an Android emulator, installs the freshly built APK and reports what logcat says.
  # This is the only way to find out why the app closes on a phone without having the phone.
  emulator:
    name: Run APK on an emulator
    needs: android
    runs-on: ubuntu-latest
    if: needs.android.result == 'success'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sonic4-android-apk
          path: apk

      - name: Setup Java (JDK 17, required by the Android SDK tools)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm"

      - name: Install the emulator and the system image
        timeout-minutes: 15
        run: |
          set +e
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1
          timeout 600 "$SDKMANAGER" "platform-tools" "emulator" "$ANDROID_IMAGE" > sdkmanager.log 2>&1
          code=$?
          echo "sdkmanager exit code: $code"
          tail -20 sdkmanager.log
          if [ $code -ne 0 ]; then
            echo "::error title=sdkmanager failed::$(tail -c 1500 sdkmanager.log | tr -d '\r' | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
            exit $code
          fi

      - name: Boot the emulator
        timeout-minutes: 25
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          AVDMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/avdmanager 2>/dev/null | head -1)

          {
            echo "--- env ---"; env | grep -iE 'android|home' | sort
            echo "--- avdmanager: $AVDMANAGER"
            echo "--- AVD list before ---"; "$AVDMANAGER" list avd 2>&1 | head -20
            echo "--- create avd ---"
            echo no | "$AVDMANAGER" create avd -n test -k "$ANDROID_IMAGE" --device pixel_5 --force 2>&1 | tail -25
            echo "exit code of the pipeline: $?"
            echo "--- ls $ANDROID_AVD_HOME ---"; ls -la "$ANDROID_AVD_HOME" 2>&1
            echo "--- find test.ini ---"; find / -name 'test.ini' 2>/dev/null | head -5
            echo "--- find *.avd directories ---"; find / -maxdepth 7 -type d -name 'test.avd' 2>/dev/null | head -5
            echo "--- AVD list after ---"; "$AVDMANAGER" list avd 2>&1 | head -20
          } > avd-setup.log 2>&1
          tail -60 avd-setup.log

          # If avdmanager put the AVD somewhere unexpected, point the emulator at it.
          if [ ! -f "$ANDROID_AVD_HOME/test.ini" ]; then
            AVDDIR=$(find / -maxdepth 7 -type d -name 'test.avd' 2>/dev/null | head -1)
            echo "AVDDIR=$AVDDIR"
            if [ -n "$AVDDIR" ]; then
              printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=test.avd\ntarget=android-34\n' "$AVDDIR" > "$ANDROID_AVD_HOME/test.ini"
              cp "$AVDDIR/config.ini" "$AVDDIR/config.ini.bak" 2>/dev/null
            else
              echo "::error title=Creating the AVD failed::avdmanager did not create an AVD anywhere on disk. See the report file attached to the branch."
              exit 1
            fi
          fi
          ls -la "$ANDROID_AVD_HOME"

          echo "--- acceleration check ---"
          emulator -accel-check 2>&1 | head -5

          nohup emulator -avd test -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            -memory 2048 -partition-size 4096 -verbose > emulator.log 2>&1 &
          EMU_PID=$!
          echo "emulator started with pid $EMU_PID"
          sleep 25
          head -40 emulator.log

          if ! kill -0 $EMU_PID 2>/dev/null; then
            echo "::error title=The emulator process died right after start::$(tail -c 1500 emulator.log | tr -d '\r' | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
            exit 1
          fi

          for i in $(seq 1 60); do
            adb devices | grep -q emulator- && break
            sleep 5
          done
          adb devices
          if ! adb devices | grep -q emulator-; then
            echo "::error title=adb never saw the emulator::$(tail -c 1500 emulator.log | tr -d '\r' | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
            exit 1
          fi

          booted=0
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          echo "booted=$booted after $((i * 5))s"
          if [ $booted -ne 1 ]; then
            echo "::error title=The emulator did not finish booting::$(tail -c 1500 emulator.log | tr -d '\r' | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
            exit 1
          fi
          adb shell wm size

      - name: Install and run the APK
        timeout-minutes: 15
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          APK=$(ls apk/*Signed.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls apk/*.apk | head -1)
          echo "installing $APK"
          adb install -r -t "$APK" > install.log 2>&1
          cat install.log
          if ! grep -q Success install.log; then
            echo "::error title=The APK could not be installed::$(tr '\n' ' ' < install.log | head -c 1500)"
            exit 1
          fi

          adb logcat -c
          adb shell monkey -p ${APP_ID} -c android.intent.category.LAUNCHER 1 > monkey.log 2>&1
          cat monkey.log
          sleep 45
          adb logcat -d -v time > logcat.txt 2>&1
          adb shell pidof ${APP_ID} > pid.txt
          echo "pid after 45s: $(cat pid.txt)"

          grep -E 'Sonic4Ep1' logcat.txt > interesting.txt
          grep -E 'FATAL EXCEPTION|AndroidRuntime|UnsatisfiedLinkError|dlopen|signal [0-9]+|NoClassDefFoundError|ClassNotFoundException|monodroid|mono-rt|System\.(Exception|NullReference|MissingMethod|TypeInitialization|NotSupported|DllNotFound|EntryPoint)' logcat.txt >> interesting.txt
          echo "--- interesting logcat lines ---"
          cat interesting.txt

          awk 'length($0) > 0 { printf "::error title=logcat::%s\n", $0 }' < <(sed -e 's/%/%25/g' -e 's/\r//g' interesting.txt | head -30)

          if [ -z "$(cat pid.txt)" ]; then
            awk 'length($0) > 0 { printf "::error title=logcat-tail::%s\n", $0 }' < <(sed -e 's/%/%25/g' -e 's/\r//g' logcat.txt | tail -25)
            exit 1
          fi

          echo "::notice title=Emulator run finished::The app is still running after 45 seconds (pid $(cat pid.txt))."

      # Belt and braces reporting: annotations are handy but rate limited and the job summary can
      # not be read from everywhere, so everything is also collected into a file that is committed
      # to the branch. This step runs no matter how the previous steps went.
      - name: Attach the reports to the branch
        if: always() && github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set +e
          mkdir -p ci-reports
          OUT="ci-reports/emulator-${GITHUB_RUN_ID}.txt"
          {
            echo "run: $GITHUB_RUN_ID  sha: $GITHUB_SHA"
            echo "=== app pid after the wait ==="; cat pid.txt 2>/dev/null
            echo "=== interesting logcat lines ==="; cat interesting.txt 2>/dev/null
            echo "=== install output ==="; cat install.log 2>/dev/null
            echo "=== monkey output ==="; cat monkey.log 2>/dev/null
            for f in *.log; do
              echo "=== $f (first 40) ==="; head -40 "$f" 2>/dev/null
              echo "=== $f (last 40) ==="; tail -40 "$f" 2>/dev/null
            done
          } > "$OUT" 2>&1
          wc -l "$OUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-reports
          if git diff --cached --quiet; then echo "nothing to report"; exit 0; fi
          git commit -q -m "CI emulator report for run ${GITHUB_RUN_ID} [skip ci]"
          for i in 1 2 3 4; do
            if git push origin "HEAD:${BRANCH}"; then echo pushed; break; fi
            git pull --rebase --autostash origin "${BRANCH}" || true
            sleep 5
          done
